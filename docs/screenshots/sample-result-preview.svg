    <linearGradient id="side" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#262343"/><stop offset="1" stop-color="#19172e"/></linearGradient>
    <linearGradient id="risk" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f08386"/><stop offset="1" stop-color="#d95977"/></linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#342d64" flood-opacity=".09"/></filter>
  </defs>
